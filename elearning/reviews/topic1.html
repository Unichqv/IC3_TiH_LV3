// Chuẩn hóa dữ liệu để tương thích với phần hiển thị trong script.js.
quiz.questions = quiz.questions.map(question => {
  if (!question.type && Array.isArray(question.options)) {
    question.type = "multiple-choice";
  }

  if (question.type === "binary" && Array.isArray(question.items)) {
    question.items = question.items.map(item =>
      Array.isArray(item) ? item : [item.label, item.correct]
    );
  }

  return question;
});
